name: Reset public demo data

# The public demo (https://ai-butler-erp.vercel.app) lets anyone create documents.
# Every night its database is emptied and the sample shop is built again by the same
# script CI runs: python -m app.demo, pointed at the hosted database.
# Needs the repository secret DEMO_DATABASE_URL (the hosted database's direct, unpooled
# connection string); without it the job says so and does nothing.

on:
  schedule:
    - cron: "0 19 * * *" # 03:00 in Malaysia (UTC+8)
  workflow_dispatch:

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
    steps:
      - name: Is the database secret set?
        id: have
        working-directory: .
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "DEMO_DATABASE_URL is not set: nothing to reset."; fi
      - uses: actions/checkout@v4
        if: steps.have.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.have.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        if: steps.have.outputs.ok == 'true'
        run: pip install -e .
      - name: Empty the demo database and seed it again
        if: steps.have.outputs.ok == 'true'
        env:
          DEMO_RESET_REMOTE: "1"
          EMBED_PROVIDER: none
          LLM_BASE_URL: ""
        run: |
          python -m app.demo > /dev/null
          echo "Demo data rebuilt."
